<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 14" width="100%" height="14">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="divider-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Glowing breathing center flare -->
  <ellipse cx="440" cy="7" rx="140" ry="6" fill="url(#divider-glow)">
    <animate attributeName="rx" values="100;160;100" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
  </ellipse>
  
  <line x1="40" y1="7" x2="840" y2="7" stroke="url(#divider-grad)" stroke-width="1.2" stroke-linecap="round" />
  
  <!-- Core pulsing diamond / node -->
  <circle cx="440" cy="7" r="3.2" fill="#10b981">
    <animate attributeName="r" values="2.5;4;2.5" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="440" cy="7" r="1.5" fill="#ffffff" />
</svg>
