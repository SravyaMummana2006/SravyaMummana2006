<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <radialGradient id="emerald-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="accent-glow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accent for Borders -->
    <linearGradient id="border-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#047857" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262d" stroke-width="0.6" stroke-opacity="0.35" />
      <circle cx="24" cy="24" r="0.75" fill="#10b981" fill-opacity="0.3" />
    </pattern>

    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #f0f6fc;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 15px;
        fill: #9ca3af;
        letter-spacing: 0.2px;
      }
      .text-accent {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-weight: 600;
        font-size: 11px;
        fill: #10b981;
        letter-spacing: 1.5px;
      }
      .text-pill {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-weight: 500;
        font-size: 10px;
        fill: #34d399;
        letter-spacing: 0.8px;
      }
      .text-meta {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-weight: 400;
        font-size: 11px;
        fill: #6e7681;
      }
      .pulse-dot {
        animation: pulse 2.5s infinite ease-in-out;
        transform-origin: 52px 42px;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .beam-glow {
        animation: beamMove 8s infinite linear;
      }
      @keyframes beamMove {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(900px); }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="220" rx="12" fill="url(#bg-grad)" />
  <rect width="880" height="220" rx="12" fill="url(#grid-pattern)" />
  <rect width="880" height="220" rx="12" fill="url(#emerald-glow)" />
  <rect width="880" height="220" rx="12" fill="url(#accent-glow)" />

  <!-- Outer Card Border -->
  <rect x="1" y="1" width="878" height="218" rx="11" fill="none" stroke="url(#border-stroke)" stroke-width="1.2" />

  <!-- Top Status Pill -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="270" height="26" rx="13" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-opacity="0.6" stroke-width="1" />
    <circle class="pulse-dot" cx="14" cy="13" r="4" fill="#10b981" />
    <text x="28" y="17" class="text-pill">SYSTEM ARCHITECTURE &amp; APPLIED AI</text>
  </g>

  <!-- Right Terminal Coordinates / Telemetry -->
  <g transform="translate(680, 42)">
    <text x="160" y="0" text-anchor="end" class="text-meta">LOCATION: HYDERABAD, INDIA</text>
    <text x="160" y="16" text-anchor="end" class="text-meta">SPECIALIZATION: AI / ML &amp; SYSTEMS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(40, 95)">
    <text x="0" y="0" class="text-title">Sravya Mummana</text>
    <circle cx="342" cy="-10" r="3.5" fill="#10b981" />
  </g>

  <!-- Positioning Sub-heading -->
  <g transform="translate(40, 126)">
    <text x="0" y="0" class="text-sub">AI/ML Engineer</text>
    <text x="116" y="0" class="text-accent">•</text>
    <text x="132" y="0" class="text-sub">Software Developer</text>
    <text x="286" y="0" class="text-accent">•</text>
    <text x="302" y="0" class="text-sub">Research Enthusiast</text>
  </g>

  <!-- Technical Depth Tags (Bottom Row) -->
  <g transform="translate(40, 175)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="26" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <circle cx="12" cy="13" r="3" fill="#10b981" />
      <text x="24" y="17" class="text-meta">BIOMETRICS &amp; DEEPFAKE R&amp;D</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(232, 0)">
      <rect x="0" y="0" width="220" height="26" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <circle cx="12" cy="13" r="3" fill="#10b981" />
      <text x="24" y="17" class="text-meta">HIGH-PERFORMANCE SYSTEMS</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(464, 0)">
      <rect x="0" y="0" width="220" height="26" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <circle cx="12" cy="13" r="3" fill="#10b981" />
      <text x="24" y="17" class="text-meta">VERIFIABLE CLOUD BACKENDS</text>
    </g>
  </g>

  <!-- Subtle Bottom Ambient Beam -->
  <line x1="40" y1="219" x2="840" y2="219" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="80 120 40 200 60" />
</svg>
