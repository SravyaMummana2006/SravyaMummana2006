<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c" />
      <stop offset="45%" stop-color="#0a0f16" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>

    <radialGradient id="emerald-glow" cx="82%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20" />
      <stop offset="40%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="accent-glow" cx="12%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#047857" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="border-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#059669" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <!-- Laser Sweep Gradient -->
    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="grid-pattern" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#21262d" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="22" cy="22" r="0.75" fill="#10b981" fill-opacity="0.25" />
    </pattern>

    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #f0f6fc;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 15px;
        fill: #9ca3af;
        letter-spacing: 0.2px;
      }
      .text-accent {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 11px;
        fill: #10b981;
      }
      .text-pill {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 10px;
        fill: #34d399;
        letter-spacing: 0.8px;
      }
      .text-meta {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 500;
        font-size: 10.5px;
        fill: #6e7681;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="220" rx="12" fill="url(#bg-grad)" />
  <rect width="880" height="220" rx="12" fill="url(#grid-pattern)" />
  <rect width="880" height="220" rx="12" fill="url(#emerald-glow)" />
  <rect width="880" height="220" rx="12" fill="url(#accent-glow)" />

  <!-- Outer Card Border -->
  <rect x="1" y="1" width="878" height="218" rx="11" fill="none" stroke="url(#border-stroke)" stroke-width="1.2" />

  <!-- Top Laser Beam Sweep -->
  <g>
    <line x1="2" y1="2" x2="200" y2="2" stroke="url(#laser-glow)" stroke-width="2">
      <animate attributeName="x1" values="-200;880" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;1080" dur="6s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Top Status Pill -->
  <g transform="translate(40, 26)">
    <rect x="0" y="0" width="276" height="26" rx="13" fill="#064e3b" fill-opacity="0.35" stroke="#059669" stroke-opacity="0.6" stroke-width="1" />
    
    <!-- Outer Ripple (SMIL Animation) -->
    <circle cx="14" cy="13" r="4" fill="none" stroke="#10b981">
      <animate attributeName="r" values="4;10;13" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.3;0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Core Pulsing Dot (SMIL Animation) -->
    <circle cx="14" cy="13" r="4" fill="#10b981">
      <animate attributeName="r" values="3.5;5;3.5" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite" />
    </circle>
    
    <text x="28" y="17" class="text-pill">SYSTEM ARCHITECTURE &amp; APPLIED AI</text>
  </g>

  <!-- Right Terminal Coordinates / Telemetry -->
  <g transform="translate(680, 40)">
    <text x="160" y="0" text-anchor="end" class="text-meta">SYSTEM STATE: ACTIVE INFERENCE</text>
    <text x="160" y="16" text-anchor="end" class="text-meta">DOMAIN: AI / ML &amp; SYSTEMS</text>
    <circle cx="166" cy="-4" r="2" fill="#10b981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Main Headline -->
  <g transform="translate(40, 96)">
    <text x="0" y="0" class="text-title">Sravya Mummana</text>
    <circle cx="342" cy="-10" r="4" fill="#10b981">
      <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#10b981;#34d399;#10b981" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Positioning Sub-heading -->
  <g transform="translate(40, 128)">
    <text x="0" y="0" class="text-sub">AI/ML Engineer</text>
    <text x="116" y="0" class="text-accent">•</text>
    <text x="132" y="0" class="text-sub">Software Developer</text>
    <text x="286" y="0" class="text-accent">•</text>
    <text x="302" y="0" class="text-sub">Research Enthusiast</text>
  </g>

  <!-- Technical Depth Badges (Bottom Row) -->
  <g transform="translate(40, 172)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="224" height="28" rx="6" fill="#12171f" stroke="#26303d" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#10b981" />
      <text x="28" y="18" class="text-meta">BIOMETRICS &amp; DEEPFAKES</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(236, 0)">
      <rect x="0" y="0" width="224" height="28" rx="6" fill="#12171f" stroke="#26303d" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#10b981" />
      <text x="28" y="18" class="text-meta">HIGH-PERFORMANCE SYSTEMS</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(472, 0)">
      <rect x="0" y="0" width="224" height="28" rx="6" fill="#12171f" stroke="#26303d" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#10b981" />
      <text x="28" y="18" class="text-meta">VERIFIABLE CLOUD BACKENDS</text>
    </g>
  </g>

  <!-- Bottom Accent Beam (SMIL) -->
  <line x1="40" y1="219" x2="840" y2="219" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
  <line x1="40" y1="219" x2="200" y2="219" stroke="#34d399" stroke-width="2.5">
    <animate attributeName="x1" values="40;680;40" dur="7s" repeatCount="indefinite" />
    <animate attributeName="x2" values="200;840;200" dur="7s" repeatCount="indefinite" />
  </line>
</svg>
