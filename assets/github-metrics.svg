<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="metrics-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c" />
      <stop offset="50%" stop-color="#0a0f16" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="metrics-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#047857" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <!-- Progress Bar Gradients -->
    <linearGradient id="bar-python" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="bar-rust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="bar-java" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="bar-ts" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <style>
      .txt-title {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #34d399;
        letter-spacing: 0.8px;
      }
      .txt-sec {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        fill: #f0f6fc;
      }
      .txt-sub {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .txt-val {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #10b981;
      }
      .txt-badge {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        fill: #c9d1d9;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="880" height="210" rx="10" fill="url(#metrics-bg)" stroke="url(#metrics-border)" stroke-width="1.2" />

  <!-- Card Header -->
  <g transform="translate(30, 24)">
    <!-- Animated Status Beacon -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="#10b981">
      <animate attributeName="r" values="3;9;12" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.3;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="4" fill="#10b981" />

    <text x="14" y="4" class="txt-title">ENGINEERING BENCHMARKS &amp; REPOSITORY METRICS</text>
    <text x="820" y="4" class="txt-sub" text-anchor="end">SOURCE: AUDITED PUBLIC REPOSITORIES</text>
  </g>

  <!-- Inner Splitter Line -->
  <line x1="440" y1="42" x2="440" y2="190" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4" />

  <!-- LEFT PANEL: Engineering Benchmarks -->
  <g transform="translate(30, 52)">
    <text x="0" y="0" class="txt-sub" font-weight="600" fill="#6e7681">VERIFIED CAPABILITIES &amp; METRICS</text>

    <!-- Row 1 -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="390" height="26" rx="4" fill="#121720" stroke="#21262d" stroke-width="0.8" />
      <text x="12" y="17" class="txt-sec">Public Implementations</text>
      <text x="378" y="17" class="txt-val" text-anchor="end">18 Repositories</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="390" height="26" rx="4" fill="#121720" stroke="#21262d" stroke-width="0.8" />
      <text x="12" y="17" class="txt-sec">Automated Test Rigor</text>
      <text x="378" y="17" class="txt-val" text-anchor="end">344 Tests Passing</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 78)">
      <rect x="0" y="0" width="390" height="26" rx="4" fill="#121720" stroke="#21262d" stroke-width="0.8" />
      <text x="12" y="17" class="txt-sec">Rust Parallel Log Engine</text>
      <text x="378" y="17" class="txt-val" text-anchor="end">3.1M Ingest / ~437ms</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="390" height="26" rx="4" fill="#121720" stroke="#21262d" stroke-width="0.8" />
      <text x="12" y="17" class="txt-sec">Biometric Identity Isolation</text>
      <text x="378" y="17" class="txt-val" text-anchor="end">Protocol C (HiDF)</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Primary Language Distribution -->
  <g transform="translate(460, 52)">
    <text x="0" y="0" class="txt-sub" font-weight="600" fill="#6e7681">LANGUAGE &amp; ECOSYSTEM TELEMETRY</text>

    <!-- Python Bar -->
    <g transform="translate(0, 18)">
      <text x="0" y="10" class="txt-badge">Python (AI / ML &amp; Computer Vision)</text>
      <text x="390" y="10" class="txt-val" text-anchor="end">38%</text>
      <rect x="0" y="16" width="390" height="6" rx="3" fill="#161b22" />
      <rect x="0" y="16" width="148" height="6" rx="3" fill="url(#bar-python)">
        <animate attributeName="width" values="0;148" dur="1.2s" fill="freeze" />
      </rect>
    </g>

    <!-- Rust Bar -->
    <g transform="translate(0, 48)">
      <text x="0" y="10" class="txt-badge">Rust (High-Throughput Systems)</text>
      <text x="390" y="10" class="txt-val" text-anchor="end">24%</text>
      <rect x="0" y="16" width="390" height="6" rx="3" fill="#161b22" />
      <rect x="0" y="16" width="94" height="6" rx="3" fill="url(#bar-rust)">
        <animate attributeName="width" values="0;94" dur="1.4s" fill="freeze" />
      </rect>
    </g>

    <!-- Java Bar -->
    <g transform="translate(0, 78)">
      <text x="0" y="10" class="txt-badge">Java 21 LTS (Forensic Client &amp; Concurrency)</text>
      <text x="390" y="10" class="txt-val" text-anchor="end">18%</text>
      <rect x="0" y="16" width="390" height="6" rx="3" fill="#161b22" />
      <rect x="0" y="16" width="70" height="6" rx="3" fill="url(#bar-java)">
        <animate attributeName="width" values="0;70" dur="1.6s" fill="freeze" />
      </rect>
    </g>

    <!-- TypeScript & C++ Bar -->
    <g transform="translate(0, 108)">
      <text x="0" y="10" class="txt-badge">TypeScript, C++, SQL &amp; Core Shell</text>
      <text x="390" y="10" class="txt-val" text-anchor="end">20%</text>
      <rect x="0" y="16" width="390" height="6" rx="3" fill="#161b22" />
      <rect x="0" y="16" width="78" height="6" rx="3" fill="url(#bar-ts)">
        <animate attributeName="width" values="0;78" dur="1.8s" fill="freeze" />
      </rect>
    </g>
  </g>
</svg>
